version: '3.8'

services:
  python-probe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-probe
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_VERSION=1.0.0
      - APP_COMMIT_SHA=local-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - probe-network

networks:
  probe-network:
    driver: bridge
