# GitLab CI/CD Pipeline for python-probe
# Manual trigger only to avoid pipeline noise
# Trigger via UI or API when needed

stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: docker.io
  IMAGE_NAME: tyrelfecha/python-app

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  only:
    - web  # Manual trigger only
  before_script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  script:
    - export COMMIT_ID=${CI_COMMIT_SHA:0:6}
    - echo "Building image with tag $COMMIT_ID"
    - docker build -t $REGISTRY/$IMAGE_NAME:$COMMIT_ID .
    - docker push $REGISTRY/$IMAGE_NAME:$COMMIT_ID
    - echo "COMMIT_ID=$COMMIT_ID" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  allow_failure: false

deploy:
  stage: deploy
  image: alpine:latest
  only:
    - web  # Manual trigger only
  needs:
    - build
  before_script:
    - apk add --no-cache py3-pip curl
    - pip install pyyaml
  script:
    - export COMMIT_ID=${CI_COMMIT_SHA:0:6}
    - echo "Deploying with commit $COMMIT_ID"
    - |
      python3 << 'EOF'
      import yaml
      with open('chart/python-app/values.yaml', 'r') as f:
          values = yaml.safe_load(f)
      values['image']['tag'] = "$COMMIT_ID"
      with open('chart/python-app/values.yaml', 'w') as f:
          yaml.dump(values, f)
      EOF
    - git config --global user.email "ci-bot@gitlab.local"
    - git config --global user.name "CI Bot"
    - git add chart/python-app/values.yaml
    - git commit -m "Updates values.yaml with commit $COMMIT_ID" || true
    - git push https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git HEAD:${CI_COMMIT_REF_NAME}
    - |
      # ArgoCD sync (optional - uncomment if configured)
      # curl -X POST https://argocd-server.local/api/v1/applications/python-app/sync \
      #   -H "Authorization: Bearer $ARGOCD_TOKEN" \
      #   -H "Content-Type: application/json"
  environment:
    name: production
  allow_failure: true
